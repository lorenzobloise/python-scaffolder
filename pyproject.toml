[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-scaffoldr"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = ["pyyaml", "tqdm"]

[project.scripts]
python-scaffolder = "python_scaffolder.cli:main"
python-scaffolder-setup = "bootstrap:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
py-modules = ["bootstrap"]

[tool.setuptools.packages.find]
where = ["."]
include = ["python_scaffolder*"]

[tool.setuptools.package-data]
python_scaffolder = [
    "default_config.yaml",
    "assets/**/*"
]
